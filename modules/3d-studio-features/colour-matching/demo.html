<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Wardrobe — Smart Outfit Colour Matcher Live Demo</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Feature CSS -->
  <link rel="stylesheet" href="colour-matching.css">

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #F4F1EA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .demo-navbar {
      width: 100%;
      max-width: 900px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6B7280;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #111827;
    }

    .demo-badge-banner {
      background: #E5E7EB;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    #matcherContainer {
      width: 100%;
      max-width: 900px;
    }
  </style>
</head>
<body>

  <div class="demo-navbar">
    <a href="/index.html" class="back-link">← Back to Main Woobi App</a>
    <span class="demo-badge-banner">AURA WARDROBE — SMART COLOUR MATCHER</span>
  </div>

  <div id="matcherContainer"></div>

  <script type="module">
    import { createColourSelectionInterface } from './index.js';

    // Initialize interactive UI
    const ui = createColourSelectionInterface({
      initialShirt: 'Crisp White',
      initialPants: 'Midnight Navy',
      initialShoes: 'Espresso Brown'
    });

    // Mount to page container
    ui.mount('#matcherContainer');

    console.log('✓ AURA Smart Outfit Colour Matcher mounted successfully.');
  </script>
</body>
</html>
